#
# Publishes the container image (with build provenance and SBOM) and a tarball
# of the Wiki.js module when a version tag is pushed:  git tag v0.1.0 && git push --tags
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub release
      packages: write   # push to ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Release gate (hygiene, tests, placeholders)
        run: |
          sh scripts/check-repo.sh --release
          npm ci --ignore-scripts
          npm run typecheck
          npm test
          npm run build
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lower-case image name (ghcr.io requires it)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
      - name: Package the Wiki.js module and create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tar -C dist/wikijs-module -czf "wikijs-psono-connector-module-${GITHUB_REF_NAME}.tar.gz" html-psono-connector
          sha256sum wikijs-psono-connector-module-*.tar.gz > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --generate-notes \
            "wikijs-psono-connector-module-${GITHUB_REF_NAME}.tar.gz" SHA256SUMS
