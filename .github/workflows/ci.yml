# SPDX-License-Identifier: AGPL-3.0-only
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs; Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Repository hygiene (headers, secrets, private strings)
        run: sh scripts/check-repo.sh
      - run: npm ci --ignore-scripts
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=low
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Compatibility with official Wiki.js images
        run: >
          sh scripts/compat-wikijs.sh
          ghcr.io/requarks/wiki:2
          ghcr.io/requarks/wiki:2.5.300
          requarks/wiki:2.5.170
      - name: Container image builds and starts its CLI
        run: |
          docker build -t wikijs-psono-connector:ci .
          docker run --rm wikijs-psono-connector:ci node main.cjs --help

  # Exercises the release's image path (buildx, metadata, build with provenance and
  # SBOM) on every run without pushing anything, so the release workflow is not
  # first tried on a real tag.
  release-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lower-case image name (ghcr.io requires it)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: type=raw,value=dry-run
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

